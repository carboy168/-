name: Build Windows Installer (official source)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout official repository source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: Run regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Preflight
        shell: pwsh
        run: python desktop_tools/preflight.py
      - name: Backend smoke test
        shell: pwsh
        run: python desktop_tools/backend_smoke_test.py
      - name: Build application
        shell: pwsh
        run: pyinstaller --noconfirm --clean installer/EngineeringNormAgent.spec
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Setup.exe
        shell: pwsh
        run: |
          $iss = "installer\EngineeringNormAgent.iss"
          $content = Get-Content $iss -Encoding UTF8
          $content | Where-Object { $_ -notmatch 'ChineseSimplified\.isl' } | Set-Content $iss -Encoding UTF8
          $candidates = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc $iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
      - name: Verify and hash installer
        shell: pwsh
        run: |
          $setup = "release\工程规范智能体_V1.0_Setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup.exe not generated" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "SHA256  $hash  工程规范智能体_V1.0_Setup.exe" | Out-File `
            "release\工程规范智能体_V1.0_Setup_SHA256.txt" -Encoding utf8
      - name: Create source archive from the same commit
        shell: pwsh
        run: git archive --format=zip --output=release/EngineeringNormAgent_source.zip HEAD
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EngineeringNormAgent-Windows
          path: |
            release/工程规范智能体_V1.0_Setup.exe
            release/工程规范智能体_V1.0_Setup_SHA256.txt
            release/EngineeringNormAgent_source.zip
          retention-days: 30
