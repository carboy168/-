name: Build Engineering Norm Agent Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "EngineeringNormAgent_V1.0_source.zip"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null
          Expand-Archive -Path "EngineeringNormAgent_V1.0_source.zip" -DestinationPath buildsrc -Force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        working-directory: buildsrc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Repair V1.0.1 core catalogue
        shell: pwsh
        working-directory: buildsrc
        run: |
          $runtimeB64 = @'
          
          '@
          [IO.File]::WriteAllBytes(
            (Join-Path (Get-Location) "desktop\runtime.py"),
            [Convert]::FromBase64String($runtimeB64.Trim())
          )

          $iss = "installer\EngineeringNormAgent.iss"
          $issText = Get-Content $iss -Raw -Encoding UTF8
          $issText = $issText.Replace('#define MyAppVersion "1.0.0"', '#define MyAppVersion "1.0.1"')
          Set-Content $iss $issText -Encoding UTF8

          if (Test-Path "data\norms.db") {
            Remove-Item "data\norms.db" -Force
          }

          $env:DATABASE_PATH = (Join-Path (Get-Location) "data\norms.db")
          python seed_core_standards.py
          python migrate_phase2.py
          python migrate_phase3.py

          $verify = @'
          import sqlite3
          db = sqlite3.connect(r"data\norms.db")
          total = db.execute("SELECT COUNT(*) FROM standards").fetchone()[0]
          active = db.execute("SELECT COUNT(*) FROM standards WHERE status IN ('现行','即将实施')").fetchone()[0]
          pending = db.execute("SELECT COUNT(*) FROM standards WHERE status='待核验'").fetchone()[0]
          overrides = db.execute("SELECT COUNT(*) FROM standard_clause_overrides").fetchone()[0]
          db.close()
          print("Core catalogue:", total, active, pending, overrides)
          assert total == 77
          assert active == 41
          assert pending == 36
          assert overrides >= 24
          '@
          $verify | python -

      - name: Preflight
        shell: pwsh
        working-directory: buildsrc
        run: python desktop_tools/preflight.py

      - name: Backend smoke test
        shell: pwsh
        working-directory: buildsrc
        run: python desktop_tools/backend_smoke_test.py

      - name: Build application
        shell: pwsh
        working-directory: buildsrc
        run: pyinstaller --noconfirm --clean installer/EngineeringNormAgent.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Setup.exe
        shell: pwsh
        working-directory: buildsrc
        run: |
          $iss = "installer\EngineeringNormAgent.iss"
          $content = Get-Content $iss -Encoding UTF8
          $content | Where-Object { $_ -notmatch 'ChineseSimplified\.isl' } | Set-Content $iss -Encoding UTF8

          $candidates = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }

          & $iscc $iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

      - name: Verify and hash
        shell: pwsh
        working-directory: buildsrc
        run: |
          $setup = "release\工程规范智能体_V1.0_Setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup.exe not generated" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "SHA256  $hash  工程规范智能体_V1.0_Setup.exe" | Out-File `
            "release\工程规范智能体_V1.0_Setup_SHA256.txt" -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EngineeringNormAgent-Windows-Installer-V1.0.1
          path: |
            buildsrc/release/工程规范智能体_V1.0_Setup.exe
            buildsrc/release/工程规范智能体_V1.0_Setup_SHA256.txt
          retention-days: 30

      - name: Publish Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "desktop-v1.0.1-latest"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }
          gh release create $tag `
            "buildsrc\release\工程规范智能体_V1.0_Setup.exe" `
            "buildsrc\release\工程规范智能体_V1.0_Setup_SHA256.txt" `
            --target "${{ github.sha }}" `
            --title "工程规范智能体 V1.0.1 Desktop Windows版" `
            --notes "V1.0.1 修复核心规范库初始化。内置77本核心规范，其中现行/即将实施41本、待核验36本。可直接覆盖安装V1.0。"
