name: Build Engineering Norm Agent Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "EngineeringNormAgent_V1.0_source.zip"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null
          Expand-Archive -Path "EngineeringNormAgent_V1.0_source.zip" -DestinationPath buildsrc -Force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        working-directory: buildsrc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Preflight
        shell: pwsh
        working-directory: buildsrc
        run: python desktop_tools/preflight.py

      - name: Backend smoke test
        shell: pwsh
        working-directory: buildsrc
        run: python desktop_tools/backend_smoke_test.py

      - name: Build application
        shell: pwsh
        working-directory: buildsrc
        run: pyinstaller --noconfirm --clean installer/EngineeringNormAgent.spec

     - name: Install Inno Setup
  shell: pwsh
  run: |
    choco install innosetup -y --no-progress
    $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
    New-Item -ItemType Directory -Force -Path "$inno\Languages" | Out-Null
    Copy-Item "$inno\Default.isl" "$inno\Languages\ChineseSimplified.isl" -Force

      - name: Build Setup.exe
        shell: pwsh
        working-directory: buildsrc
        run: |
          $candidates = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "installer\EngineeringNormAgent.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

      - name: Verify and hash
        shell: pwsh
        working-directory: buildsrc
        run: |
          $setup = "release\工程规范智能体_V1.0_Setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup.exe not generated" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "SHA256  $hash  工程规范智能体_V1.0_Setup.exe" | Out-File `
            "release\工程规范智能体_V1.0_Setup_SHA256.txt" -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EngineeringNormAgent-Windows-Installer
          path: |
            buildsrc/release/工程规范智能体_V1.0_Setup.exe
            buildsrc/release/工程规范智能体_V1.0_Setup_SHA256.txt
          retention-days: 30

      - name: Publish Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "desktop-v1.0-latest"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }
          gh release create $tag `
            "buildsrc\release\工程规范智能体_V1.0_Setup.exe" `
            "buildsrc\release\工程规范智能体_V1.0_Setup_SHA256.txt" `
            --target "${{ github.sha }}" `
            --title "工程规范智能体 V1.0 Desktop Windows版" `
            --notes "Windows x64 直接安装版。下载 Setup.exe 双击安装。"
