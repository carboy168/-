name: Build Windows Installer (official source)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout official repository source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load application version
        shell: pwsh
        run: |
          $line = Get-Content version.ini | Where-Object { $_ -match '^app_version=' } | Select-Object -First 1
          if (-not $line) { throw "version.ini is missing app_version" }
          $version = ($line -split '=', 2)[1].Trim()
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SETUP_BASENAME=工程规范智能体_V${version}_Setup" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: Run V1.3 release gate
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          if ($eventName -eq "pull_request") {
            $baseRef = "${{ github.event.pull_request.base.sha }}"
          } else {
            $baseRef = "${{ github.event.before }}"
          }
          if ([string]::IsNullOrWhiteSpace($baseRef) -or $baseRef -eq ("0" * 40)) {
            $resolvedBase = git rev-parse HEAD^ 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $resolvedBase) {
              throw "Unable to resolve a real base commit for Release Gate."
            }
            $baseRef = $resolvedBase.Trim()
          }
          git cat-file -e "$baseRef^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Release Gate base commit is unavailable: $baseRef"
          }
          python desktop_tools/release_gate.py --ci --base-ref $baseRef --json-output .test-tmp/release-gate-report.json
      - name: Build application
        shell: pwsh
        run: pyinstaller --noconfirm --clean installer/EngineeringNormAgent.spec
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Setup.exe
        shell: pwsh
        run: |
          $iss = "installer\EngineeringNormAgent.iss"
          $content = Get-Content $iss -Encoding UTF8
          $content | Where-Object { $_ -notmatch 'ChineseSimplified\.isl' } | Set-Content $iss -Encoding UTF8
          $candidates = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc $iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
      - name: Verify and hash installer
        shell: pwsh
        run: |
          $setup = "release\$env:SETUP_BASENAME.exe"
          if (-not (Test-Path $setup)) { throw "Setup.exe not generated" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "SHA256  $hash  $env:SETUP_BASENAME.exe" | Out-File `
            "release\$env:SETUP_BASENAME`_SHA256.txt" -Encoding utf8
      - name: Create source archive from the same commit
        shell: pwsh
        run: git archive --format=zip --output=release/EngineeringNormAgent_source.zip HEAD
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EngineeringNormAgent-Windows
          path: |
            release/工程规范智能体_V*_Setup.exe
            release/工程规范智能体_V*_Setup_SHA256.txt
            release/EngineeringNormAgent_source.zip
          retention-days: 30
